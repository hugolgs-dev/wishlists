class: Claim
table: claim
serverOnly: true
fields:
  itemId: int, relation(parent=item, onDelete=Cascade)
  claimerId: UuidValue, relation(parent=serverpod_auth_core_user, onDelete=Cascade)
  quantity: int, default=1
  contributionCents: int?
  purchased: bool, default=false
  createdAt: DateTime, default=now
  seenAt: DateTime, default=now
indexes:
  claim_item_claimer_idx:
    fields: itemId, claimerId
    unique: true
