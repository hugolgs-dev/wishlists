services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: wishlist
      POSTGRES_PASSWORD: "HVOxX9_2Lh5URCM2sVNy81vl3PFY91UT"
    volumes:
      - wishlist_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "JnRgNSQndba5-10HzIacruUvkFmCzwtX"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: wishlist_test
      POSTGRES_PASSWORD: "DdPqYFfol-HtJWBKJBGIXtWYjsHIizVm"
    volumes:
      - wishlist_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "B_2PJdAbk-6Ivw68160LHA4g7puBms4R"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  wishlist_data:
  wishlist_test_data:
